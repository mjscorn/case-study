<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Adyen AI — prop → icon animation</title>
<style>
  :root { --dur: 1.8s; --stage: #ffffff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0a1938; color: #e8ecf5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 40px; min-height: 100vh;
  }
  .stage {
    width: 340px; height: 340px; border-radius: 24px; background: var(--stage);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 24px 60px rgba(0,0,0,.35); transition: background .2s ease;
  }
  .mark { width: 230px; height: auto; overflow: visible; cursor: pointer; }

  /* Idle (before play): just the 4-petal flower — i and a wait off-crop */
  .mark:not(.run) .istem { transform: translateY(40px); }
  .mark:not(.run) .a     { transform: translateX(65px); }

  /* Idle flower is scaled up to the size of the finished "ai" mark and
     centred in the viewBox; clicking shrinks it back as the petals swirl. */
  .fscale, .fflicker { transform-box: view-box; transform-origin: 70px 24.5px; }
  .mark:not(.run) .fscale { transform: translate(-20px, 8.5px) scale(1.6); }
  .mark:not(.run) .fflicker { animation: flame 5s ease-in-out infinite; }
  .mark.run .fscale { animation: fshrink var(--dur) cubic-bezier(.4,0,.2,1) 1 forwards; }
  @keyframes fshrink {
    0%   { transform: translate(-20px, 8.5px) scale(1.6); }
    38%  { transform: translate(0px, 0px) scale(1); }
    100% { transform: translate(0px, 0px) scale(1); }
  }

  /* transform setup — petals orbit the flower centre (70, 24.5) */
  .mark .p-tl, .mark .p-bl, .mark .p-br, .mark .p-tr {
    transform-box: view-box; transform-origin: 70px 24.5px;
  }
  .mark .istem { transform-box: fill-box; transform-origin: center bottom; }
  .mark .a     { transform-box: fill-box; transform-origin: center; }

  .mark.run .p-tl  { animation: swirlTL var(--dur) linear 1 forwards; }
  .mark.run .p-bl  { animation: swirlBL var(--dur) linear 1 forwards; }
  .mark.run .p-br  { animation: swirlBR var(--dur) linear 1 forwards; }
  .mark.run .p-tr  { animation: anchor var(--dur) linear 1 forwards; }
  .mark.run .istem { animation: istem  var(--dur) cubic-bezier(.3,0,.2,1) 1 forwards; }
  .mark.run .a     { animation: aslide var(--dur) cubic-bezier(.35,0,.15,1) 1 forwards; }
  .mark.paused * { animation-play-state: paused !important; }

  /* three lighter petals orbit CCW (TL→BL→BR) and fold under the anchor */
  /* All three start together at 8% and rotate at the same constant angular
     speed (6.75°/1%). Over the final 40° each one eases into a corrective
     translate+scale so it comes to rest perfectly centered UNDER the anchor
     petal — fully contained by it, nothing poking out. Once covered, its
     opacity is cut silently (invisible under the solid anchor). */
  @keyframes swirlTL {
    0%    { opacity: 0; transform: rotate(0deg) translate(0px, 0px) scale(1); }
    8%    { opacity: 1; transform: rotate(0deg) translate(0px, 0px) scale(1); }
    45.5% { opacity: 1; transform: rotate(-230deg) translate(0px, 0px) scale(1); }
    52%   { opacity: 1; transform: rotate(-270deg) translate(-4.4px, -9.1px) scale(.55); }
    53.5% { opacity: 0; transform: rotate(-270deg) translate(-4.4px, -9.1px) scale(.55); }
    100%  { opacity: 0; transform: rotate(-270deg) translate(-4.4px, -9.1px) scale(.55); }
  }
  @keyframes swirlBL {
    0%    { opacity: 0; transform: rotate(0deg) translate(0px, 0px) scale(1); }
    8%    { opacity: 1; transform: rotate(0deg) translate(0px, 0px) scale(1); }
    30.8% { opacity: 1; transform: rotate(-140deg) translate(0px, 0px) scale(1); }
    37.3% { opacity: 1; transform: rotate(-180deg) translate(-7.4px, 6.1px) scale(.55); }
    38.8% { opacity: 0; transform: rotate(-180deg) translate(-7.4px, 6.1px) scale(.55); }
    100%  { opacity: 0; transform: rotate(-180deg) translate(-7.4px, 6.1px) scale(.55); }
  }
  @keyframes swirlBR {
    0%    { opacity: 0; transform: rotate(0deg) translate(0px, 0px) scale(1); }
    8%    { opacity: 1; transform: rotate(0deg) translate(0px, 0px) scale(1); }
    16.2% { opacity: 1; transform: rotate(-50deg) translate(0px, 0px) scale(1); }
    22.7% { opacity: 1; transform: rotate(-90deg) translate(4.4px, 9.1px) scale(.55); }
    24.2% { opacity: 0; transform: rotate(-90deg) translate(4.4px, 9.1px) scale(.55); }
    100%  { opacity: 0; transform: rotate(-90deg) translate(4.4px, 9.1px) scale(.55); }
  }
  /* anchor petal = the i-dot: never moves or resizes, just holds */
  @keyframes anchor {
    0%   { opacity: 0; }
    6%   { opacity: 1; }
    100% { opacity: 1; }
  }

  /* Idle candle-flame wave on the anchor petal, once the mark has settled.
     Pivots at the petal's base (its bottom-left corner). */
  .flame { transform-box: view-box; transform-origin: 73px 21.5px; }
  .mark.settled .flame { animation: flame 5s ease-in-out infinite; }
  @keyframes flame {
    0%   { transform: rotate(0deg) scale(1); }
    6%   { transform: rotate(2.6deg) scale(1.015); }
    12%  { transform: rotate(-1.9deg) scale(.995); }
    18%  { transform: rotate(1.1deg) scale(1.008); }
    24%  { transform: rotate(0deg) scale(1); }
    100% { transform: rotate(0deg) scale(1); }
  }
  /* Staggered so neither collides with the TL petal's sweep:
     the "a" emerges once TL has cleared the left corridor (~37%);
     the i rises once TL is fully at rest under the anchor (48%). */
  @keyframes istem {
    0%, 56% { opacity: 1; transform: translateY(40px); }
    92%     { opacity: 1; transform: translateY(0); }
    100%    { opacity: 1; transform: translateY(0); }
  }
  /* the "a" grows out from behind the gap (clip at x=65, its own final right
     edge) — no fade, and it never shows in the white space before the i */
  @keyframes aslide {
    0%, 44% { transform: translateX(65px); }
    74%     { transform: translateX(0); }
    100%    { transform: translateX(0); }
  }

  .controls {
    display: flex; align-items: center; gap: 22px;
    background: #12244a; border: 1px solid #24345a; border-radius: 14px; padding: 14px 20px;
  }
  .controls label { font-size: 12.5px; color: #8b98b8; display: flex; align-items: center; gap: 10px; }
  .controls input[type="range"] { width: 150px; accent-color: #00D16A; }
  .controls .val { color: #e8ecf5; font-variant-numeric: tabular-nums; min-width: 42px; }
  .btn {
    border: 1px solid #2c3d63; background: #17294f; color: #e8ecf5;
    font: inherit; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 9px; cursor: pointer;
  }
  .btn:hover { background: #1e315a; }
  .hint { font-size: 12px; color: #6b7aa0; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <svg class="mark" id="mark" viewBox="0 0 101 66" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="aClip"><rect x="-40" y="-30" width="105" height="130"/></clipPath>
        <!-- hides the i-stem below its resting baseline (y=65.5) as it rises -->
        <clipPath id="iClip"><rect x="60" y="-40" width="60" height="105.5"/></clipPath>
      </defs>
      <!-- a grows out from behind the crop at x=65 (its final right edge) -->
      <g clip-path="url(#aClip)">
        <path class="a" d="M53 0.5H0.5V16.5H37.5V48.5H26.5V27H0.5V53.5C0.5 60.1274 5.87259 65.5 12.5 65.5H65V12.5C65 5.87258 59.6274 0.5 53 0.5Z" fill="#00D16A"/>
      </g>
      <g clip-path="url(#iClip)">
        <path class="istem" d="M88 27.5H73V65.5H100V39.5C100 32.8726 94.6274 27.5 88 27.5Z" fill="#00D16A"/>
      </g>
      <!-- petals at full size; anchor (p-tr) sits exactly on the i-dot -->
      <g class="fscale"><g class="fflicker">
        <g class="p-tl"><path transform="translate(24 -15.5)" d="M31 16H16V25C16 31.6274 21.3726 37 28 37H43V28C43 21.3726 37.6274 16 31 16Z" fill="#00D16A" opacity="0.4"/></g>
        <g class="p-bl"><path transform="translate(24 -15.5)" d="M28 43H43V52C43 58.6274 37.6274 64 31 64H16V55C16 48.3726 21.3726 43 28 43Z" fill="#00D16A" opacity="0.6"/></g>
        <g class="p-br"><path transform="translate(24 -15.5)" d="M64 43H49V52C49 58.6274 54.3726 64 61 64H76V55C76 48.3726 70.6274 43 64 43Z" fill="#00D16A" opacity="0.8"/></g>
        <g class="p-tr"><g class="flame"><path transform="translate(24 -15.5)" d="M61 16H76V25C76 31.6274 70.6274 37 64 37H49V28C49 21.3726 54.3726 16 61 16Z" fill="#00D16A"/></g></g>
      </g></g>
    </svg>
  </div>

  <div class="controls">
    <label>Duration <input type="range" id="dur" min="0.6" max="6" step="0.1" value="1" autocomplete="off" /><span class="val" id="durVal">1.0s</span></label>
    <button class="btn" id="restart">Restart</button>
    <button class="btn" id="pause">Pause</button>
    <button class="btn" id="bg">Dark stage</button>
    <span class="hint">Tuning playground. The shipped version is <code>ai-mark.js</code> — see <a href="ai-mark-demo.html" style="color:#7ee2ad">ai-mark-demo.html</a>.</span>
  </div>

  <script>
    var mark = document.getElementById('mark');
    var durInput = document.getElementById('dur');
    var durVal = document.getElementById('durVal');
    var pauseBtn = document.getElementById('pause');
    var bgBtn = document.getElementById('bg');

    // Candle-flame idle: settle when the morph completes (100% of duration).
    var settleT;
    function armSettle() {
      mark.classList.remove('settled');
      clearTimeout(settleT);
      settleT = setTimeout(function () {
        mark.classList.add('settled');
      }, parseFloat(durInput.value) * 1000 + 50);
    }

    // Force the authored default. Browsers restore form state *after* parse,
    // so re-apply on pageshow (which fires after any restoration).
    var DEFAULT_DUR = 1;
    function applyDefaultDur() {
      durInput.value = DEFAULT_DUR;
      document.documentElement.style.setProperty('--dur', DEFAULT_DUR + 's');
      durVal.textContent = DEFAULT_DUR.toFixed(1) + 's';
    }
    applyDefaultDur();

    // Plays only on demand — starts idle showing the 4-petal flower.
    function play() {
      mark.classList.remove('settled', 'paused');
      pauseBtn.textContent = 'Pause';
      mark.classList.remove('run');
      // SVG elements have no offsetWidth, so cancel in-flight animations and
      // flush layout on an HTML element to guarantee a clean restart.
      mark.getAnimations({ subtree: true }).forEach(function (a) { a.cancel(); });
      void document.body.offsetWidth;
      mark.classList.add('run');
      armSettle();
    }
    function reset() {
      mark.classList.remove('run', 'settled', 'paused');
      pauseBtn.textContent = 'Pause';
      clearTimeout(settleT);
      mark.getAnimations({ subtree: true }).forEach(function (a) { a.cancel(); });
    }

    window.addEventListener('pageshow', function () { applyDefaultDur(); reset(); });
    mark.addEventListener('click', play);
    document.getElementById('restart').addEventListener('click', play);
    durInput.addEventListener('input', function () {
      document.documentElement.style.setProperty('--dur', durInput.value + 's');
      durVal.textContent = parseFloat(durInput.value).toFixed(1) + 's';
    });
    pauseBtn.addEventListener('click', function () {
      var paused = mark.classList.toggle('paused');
      pauseBtn.textContent = paused ? 'Play' : 'Pause';
    });
    var dark = false;
    bgBtn.addEventListener('click', function () {
      dark = !dark;
      document.documentElement.style.setProperty('--stage', dark ? '#0a1938' : '#ffffff');
      bgBtn.textContent = dark ? 'Light stage' : 'Dark stage';
    });
  </script>
</body>
</html>
